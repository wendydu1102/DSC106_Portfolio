<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta-Analysis: Wendy Du</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <h1>Codebase Meta-Analysis</h1>
        <p>This page provides a quantitative analysis of this website's codebase, generated from git history.</p>

        <h2>Summary</h2>
        <div id="stats"></div>

        <h2>Commits by time of day</h2>
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        
        <h2>Language Breakdown of Selection</h2>
        <dl id="language-breakdown" class="stats"></dl>
    </main>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>
        <dt>Date</dt>
        <dd id="commit-date"></dd>
        <dt>Time</dt>
        <dd id="commit-time"></dd>
        <dt>Author</dt>
        <dd id="commit-author"></dd>
        <dt>Lines Edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
    
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
